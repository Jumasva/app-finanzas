# ESLint, build y auditoría de dependencias del frontend (RNF-MAN-006 y RNF-SEG-025)
name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Estilo de código (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      # Una vulnerabilidad alta o crítica bloquea la fusión (RNF-SEG-025)
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
