server {
    listen 80;
    root /var/www/backend/public;   # Laravel solo expone su carpeta public
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;      # "app" es el nombre del servicio PHP en docker-compose
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
